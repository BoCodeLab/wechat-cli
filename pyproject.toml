[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-cli"
dynamic = ["version"]
description = "WeChat data query CLI for LLMs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "pycryptodome>=3.19,<4",
    "zstandard>=0.22,<1",
]

[project.urls]
Repository = "https://github.com/BoCodeLab/wechat-cli"

[project.scripts]
wechat-cli = "wechat_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["wechat_cli", "wechat_cli.*"]

[tool.setuptools.dynamic]
version = {attr = "wechat_cli.__version__"}

[tool.setuptools.package-data]
wechat_cli = ["bin/*"]
